<!doctype html><meta charset="utf-8"><title>Regressão da exportação Word</title>
<pre id="result">Executando...</pre>
<script src="../src/content/clipboard-word/06-sanitization.js"></script>
<script src="../src/content/clipboard-word/09-word-export.js"></script>
<script>
const checks=[];
function check(value,label){if(!value)throw new Error(label);checks.push(label);}
function fixture(answer='85',number='20') {
 return `<article data-gssf-copy-question-number="${number}" data-gssf-copy-question-index="${number}"><div><div>${number}</div><div data-automation-id="questionTitle"><b>Enunciado</b><br>2. Item interno</div></div><div data-automation-id="questionChoiceOptionContainer"><span class="text-format-content">${answer}</span></div></article>`;
}
try {
 const input=fixture();
 const output=normalizeWordQuestionMarkers(input);
 check(output.includes('Questão 20'),'Título inequívoco');
 check(!output.includes('gssf-word-option-letter'),'Não acrescenta rótulo automático');
 check(output.includes('2. Item interno'),'Número interno preservado');
 check(normalizeWordQuestionMarkers(output)===output,'Normalização idempotente');
 for(const value of ['A) 85','A. 85','A 85','A) A resposta','A) (x + 2)','(x + 2)','85']) {
  const doc=new DOMParser().parseFromString(normalizeWordQuestionMarkers(fixture(value)),'text/html');
  check(doc.querySelector('.text-format-content').textContent===value,'Letra existente preservada '+value);
 }
 for(const value of ['-25','+25','A+5','B-3','85','1','2','3','4','<b>Texto</b> com <i>ênfase</i>','<math><mi>x</mi><mo>+</mo><mn>2</mn></math>','<span class="gssf-word-option-letter">A </span><sup>2</sup>']) {
  const doc=new DOMParser().parseFromString(normalizeWordQuestionMarkers(fixture(value)),'text/html');
  const original=new DOMParser().parseFromString(value,'text/html').body.textContent;
  check(doc.querySelector('.text-format-content').textContent===original,'Conteúdo preservado '+value);
  const reference=new DOMParser().parseFromString(fixture(value),'text/html');
  check(doc.querySelector('[data-automation-id="questionChoiceOptionContainer"]').innerHTML===reference.querySelector('[data-automation-id="questionChoiceOptionContainer"]').innerHTML,'HTML completo preservado '+value);
 }

 const boldSource=document.createElement('div');
 boldSource.innerHTML='<p><b>O passeio</b></p><p>Texto normal <b>cansados, mas felizes</b> e <strong>outro destaque</strong> sem ampliar o negrito.</p><p><span style="font-weight:700">Negrito por estilo</span> <i>itálico</i> <u>sublinhado</u></p>';
 const originalBoldHtml=boldSource.innerHTML;
 const boldCopy=boldSource.cloneNode(true);
 sanitizeClonedMarkup(boldCopy);
 check(boldCopy.innerHTML===originalBoldHtml,'Sanitização preserva HTML rico completo');
 check(boldCopy.querySelectorAll('b').length===2,'Título e trecho em B preservados');
 check(boldCopy.querySelector('strong').textContent==='outro destaque','STRONG preservado');
 check(boldCopy.querySelector('span').style.fontWeight==='700','Negrito inline preservado');
 check(boldCopy.querySelector('i')&&boldCopy.querySelector('u'),'Itálico e sublinhado preservados');
 const wordHtml=buildWordHtmlDocument({innerHtml:fixture(boldCopy.innerHTML,'1')},'Teste de negrito');
 const wordDoc=new DOMParser().parseFromString(wordHtml,'text/html');
 check(wordDoc.querySelectorAll('b').length===3,'Baixar Word mantém todos os B após a limpeza');
 check(wordDoc.querySelector('.text-format-content').innerHTML===boldCopy.innerHTML,'Exportação mantém HTML misto exatamente');
 check(wordDoc.querySelector('p:nth-child(2)').querySelectorAll('b,strong').length===2,'Texto normal não vira bloco inteiro em negrito');
 check(boldSource.innerHTML===originalBoldHtml,'Fonte rica permanece intacta');
 const unsafe=document.createElement('div');
 unsafe.innerHTML='<b onclick="alert(1)">Destaque seguro</b><script>alert(1)</'+'script>';
 sanitizeClonedMarkup(unsafe);
 check(unsafe.querySelector('b')&&!unsafe.querySelector('b').hasAttribute('onclick')&&!unsafe.querySelector('script'),'B seguro não afrouxa limpeza de scripts e eventos');
 let rejected=false;
 try {normalizeWordQuestionMarkers(fixture().replace('<div>20</div>',''));} catch(e){rejected=true;}
 check(rejected,'Marcador ausente impede arquivo ambíguo');
 const live=document.createElement('div');live.innerHTML=fixture();document.body.append(live);
 normalizeWordQuestionMarkers(live.innerHTML);
 check(live.innerHTML===fixture(),'Não altera a origem');live.remove();
 window.testResult={ok:true,checks};
}catch(e){window.testResult={ok:false,checks,error:e.message};}
document.getElementById('result').textContent=JSON.stringify(window.testResult,null,2);
</script>
